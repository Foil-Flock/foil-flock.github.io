name: Minnesota
abbreviation: MN
slug: minnesota

statute:
  name: Minnesota Government Data Practices Act (MGDPA)
  short_name: MGDPA
  citation: "Minn. Stat. Ch. 13"
  url: https://www.revisor.mn.gov/statutes/cite/13

presumption: open

response:
  initial_days: 0
  final_days: null
  day_type: business
  notes: >-
    No specific day count. The statute requires compliance in an
    "appropriate and prompt manner" (§ 13.03, subd. 2(a)). Records
    available for inspection must be provided immediately; copies
    supplied as soon as reasonably possible. Denials must be
    communicated orally at the time or in writing as soon after
    as possible.

appeal:
  required_before_court: false
  deadline_days: null
  response_days: 50
  body: Direct court action (District Court)
  advisory_body:
    name: Commissioner of Administration, Data Practices Office
    url: https://mn.gov/admin/data-practices/
    phone: "(651) 296-6733"
    email: null
    address: "658 Cedar St., Suite 300, St. Paul, MN 55155"

enforcement:
  penalty_type: both
  per_day_cap: null
  attorney_fees: discretionary
  fee_trigger: >-
    Court may award reasonable attorney fees to an aggrieved person.
    Fees become mandatory if a prior Commissioner advisory opinion
    directly related to the cause of action was violated.
    Minn. Stat. § 13.08, subd. 4. Exemplary damages of $1,000 to
    $15,000 per willful violation. Civil penalties up to $1,000
    additional. Willful violation is also a misdemeanor (§ 13.09).
  court_action: Civil action to compel compliance
  court_name: District Court
  filing_fee_approx: 350
  filing_deadline_days: null
  burden_of_proof: agency

fees:
  copy_per_page: 0.25
  copy_max_size: null
  search_fee_allowed: true
  review_fee_allowed: false
  redaction_fee_allowed: false
  electronic_delivery_required: false
  notes: >-
    $0.25/page maximum for 100 or fewer pages of black-and-white,
    letter or legal-sized copies; $0.50/page for two-sided. Over
    100 pages: actual costs of searching, retrieving, employee time,
    and copying. Inspection is free. No charges for separating
    public from non-public data (§ 13.03, subd. 3). Search fees
    prohibited for data subjects requesting their own data.

alpr:
  specific_exemption: true
  exemption_citation: "Minn. Stat. \xA7 13.824"
  notes: >-
    All ALPR data is classified as private data on individuals or
    nonpublic data under Minn. Stat. § 13.824. Non-investigative
    data must be destroyed within 60 days. Access requires written
    authorization, reasonable suspicion, and documented factual
    basis. All queries must be logged. Biennial independent audits
    are required; results are public data. The Commissioner may
    suspend all ALPR devices for substantial noncompliance. Notably,
    the existence of surveillance technology itself is public data
    (§ 13.82, subd. 31).

exemptions:
  - Active investigative data (§ 13.82, subd. 7)
  - ALPR captured data (§ 13.824)
  - Body camera recordings (§ 13.825, private by default)
  - Protected identities — undercover officers, informants, victims (§ 13.82, subd. 17)
  - Response/incident data when safety threatened (§ 13.82, subd. 14)
  - Vulnerability to terrorist attack

template_fragments:
  statute_invocation: >-
    Pursuant to the Minnesota Government Data Practices Act
    (Minn. Stat. Ch. 13)
  response_reminder: >-
    I expect compliance in an appropriate and prompt manner as
    required by Minn. Stat. \xA7 13.03, subd. 2(a).
  fee_cap_notice: >-
    If fulfilling this request will cost more than $__FEE_CAP__,
    please provide an estimate before proceeding.
  electronic_delivery_clause: >-
    I request that records be provided in electronic format where
    available.
  appeal_deadline_warning: >-
    If this request is denied, I reserve the right to seek judicial
    review under Minn. Stat. \xA7 13.08 and all remedies available,
    including exemplary damages of $1,000 to $15,000 per willful
    violation and attorney fees.
