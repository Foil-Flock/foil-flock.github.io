name: Connecticut
abbreviation: CT
slug: connecticut

statute:
  name: Connecticut Freedom of Information Act
  short_name: Connecticut FOIA
  citation: "Conn. Gen. Stat. §§ 1-200 through 1-242"
  url: https://portal.ct.gov/foi/regulations/the-foi-act/2025-foi-act

presumption: open

response:
  initial_days: 4
  final_days: null
  day_type: business
  notes: >-
    Any denial must be made in writing within four business days
    of the request (CGS § 1-210(a)). If the agency does not
    deny, it must provide access promptly. Personnel and medical
    records have a 10-business-day window. There is no explicit
    statutory provision for extensions beyond the personnel
    records window.

appeal:
  required_before_court: true
  deadline_days: 30
  response_days: null
  body: Freedom of Information Commission (required before court)
  advisory_body:
    name: Connecticut Freedom of Information Commission
    url: https://portal.ct.gov/foi
    phone: "(860) 566-5682"
    email: null
    address: "165 Capitol Ave., Suite 1100, Hartford, CT 06106"

enforcement:
  penalty_type: both
  per_day_cap: null
  attorney_fees: none
  fee_trigger: >-
    FOIC may impose civil penalties of $20 to $5,000 per
    violation for denials without reasonable grounds
    (CGS § 1-206(b)(2)). No general attorney fee provision for
    prevailing requesters. Court shall sanction frivolous or
    dilatory appeals at up to $1,000 (CGS § 1-206(d)).
    Hazardous waste cases only: court may award attorney fees
    (CGS § 1-206(e)). Willful destruction of records is a
    Class A misdemeanor; failing to comply with FOIC orders is a
    Class B misdemeanor.
  court_action: Administrative appeal to Superior Court
  court_name: Superior Court
  filing_fee_approx: 360
  filing_deadline_days: 30
  burden_of_proof: agency

fees:
  copy_per_page: 0.25
  copy_max_size: null
  search_fee_allowed: false
  review_fee_allowed: false
  redaction_fee_allowed: false
  electronic_delivery_required: false
  notes: >-
    $0.25/page for state agencies; $0.50/page for all other
    public agencies (CGS § 1-212). Certified copies: $1.00
    first page, $0.50 each additional. Hand-held scanner use may
    be charged up to $20 per session. No search, review, or
    redaction fees are authorized by statute. No sales tax
    applies to copy fees.

alpr:
  specific_exemption: true
  exemption_citation: "Public Act 26-14 (SB 397)"
  notes: >-
    SB 397 (PA 26-14), signed May 4, 2026, classifies ALPR data
    as confidential. 21-day default retention limit for
    non-investigative data. Permitted uses: hotlist comparisons,
    criminal investigations with reasonable suspicion, warrant
    location, missing persons, stolen vehicle recovery.
    Prohibited: immigration enforcement; surveillance based on
    race, ethnicity, or other protected characteristics. Data
    sharing limited to NY, RI, and MA via written attestation.
    Implementation: October 1, 2026 (attestation requirements);
    January 1, 2027 (agencies must adopt policies). Annual
    reporting required.

exemptions:
  - Law enforcement investigation records (CGS § 1-210(b)(3))
  - ALPR data (PA 26-14)
  - Strategy/negotiation in pending litigation (CGS § 1-210(b)(4))
  - Preliminary drafts/notes with public interest balancing (CGS § 1-210(b)(1))
  - Records protected by attorney-client privilege (CGS § 1-210(b)(10))
  - Records creating safety risks to persons or facilities (CGS § 1-210(b)(19))

template_fragments:
  statute_invocation: >-
    Pursuant to the Connecticut Freedom of Information Act
    (Conn. Gen. Stat. §§ 1-200 through 1-242)
  response_reminder: >-
    Under Conn. Gen. Stat. § 1-210(a), any denial must be
    issued in writing within four business days of this request.
  fee_cap_notice: >-
    If fulfilling this request will cost more than $__FEE_CAP__,
    please provide an estimate before proceeding. Under
    Conn. Gen. Stat. § 1-212, copy fees shall not exceed
    twenty-five cents per page for state agencies.
  electronic_delivery_clause: >-
    I request that records be provided in electronic format where
    available, to minimize reproduction costs consistent with the
    purposes of the Freedom of Information Act.
  appeal_deadline_warning: >-
    If this request is denied, I reserve the right to appeal to
    the Freedom of Information Commission within thirty days
    under Conn. Gen. Stat. § 1-206(b), and the Commission may
    impose civil penalties of up to $5,000 for denials without
    reasonable grounds.
