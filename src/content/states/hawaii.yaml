name: Hawaii
abbreviation: HI
slug: hawaii

statute:
  name: Uniform Information Practices Act (Modified)
  short_name: UIPA
  citation: "HRS Chapter 92F"
  url: https://www.capitol.hawaii.gov/hrscurrent/Vol02_Ch0046-0115/HRS0092F/

presumption: open

response:
  initial_days: 10
  final_days: null
  day_type: business
  notes: >-
    An agency must respond within 10 business days after receipt
    of a request (HAR \xA7 2-71-13). The response must grant,
    partially grant, or deny the request. The agency must provide
    written notice of the denial, including the specific authority
    and reasons for the denial. If the agency requires additional
    time, it must notify the requester and provide an expected
    completion date. Agencies may require requesters to appear
    in person during normal business hours for inspection.

appeal:
  required_before_court: false
  deadline_days: null
  response_days: null
  body: Direct court action (Circuit Court)
  advisory_body:
    name: Office of Information Practices (OIP)
    url: https://oip.hawaii.gov/
    phone: "(808) 586-1400"
    email: null
    address: "No. 1 Capitol District Building, 250 South Hotel Street, Suite 107, Honolulu, HI 96813"

enforcement:
  penalty_type: fee_shifting
  per_day_cap: null
  attorney_fees: mandatory
  fee_trigger: >-
    If the court finds that the agency has not sustained its
    burden of justifying its refusal to allow access, the court
    shall award reasonable attorney fees and costs to the
    requester. HRS \xA7 92F-15(d). "Shall" is mandatory. The
    court may also issue an order to compel disclosure and may
    impose such other relief as the court deems appropriate.
    OIP provides advisory opinions and may recommend remedial
    action but cannot impose penalties directly.
  court_action: Civil action in circuit court
  court_name: Circuit Court
  filing_fee_approx: 315
  filing_deadline_days: null
  burden_of_proof: agency

fees:
  copy_per_page: 0.05
  copy_max_size: null
  search_fee_allowed: true
  review_fee_allowed: true
  redaction_fee_allowed: false
  electronic_delivery_required: false
  notes: >-
    Minimum $0.05/page for standard copies (\xA7 92F-21).
    Search and retrieval fees: $2.50 per 15-minute increment of
    staff time. Review fees: $5.00 per 15-minute increment for
    legal review of records to segregate disclosable from
    non-disclosable portions. First $30 in search fees waived.
    Agencies may waive fees if the request is in the public
    interest. Fees must reflect actual costs and may not be used
    as a deterrent to access.

alpr:
  specific_exemption: false
  exemption_citation: null
  notes: >-
    Hawaii has no ALPR-specific legislation or exemption. No
    statutory data retention limits or access restrictions specific
    to ALPR data. ALPR data would be analyzed under UIPA's
    general exemptions, particularly the law enforcement exception
    in HRS \xA7 92F-13(3) for records that, by their nature, must
    remain confidential to avoid frustration of a legitimate
    government function, and the significant privacy interest
    balancing test in HRS \xA7 92F-14.

exemptions:
  - Records that must remain confidential to avoid frustration of government function (HRS \xA7 92F-13(3))
  - Records whose disclosure would constitute clearly unwarranted invasion of privacy (HRS \xA7 92F-14)
  - Government records protected by other state or federal law (HRS \xA7 92F-13(4))
  - Interagency or intra-agency advisory opinions and recommendations (HRS \xA7 92F-13(2))
  - Trial preparation records (HRS \xA7 92F-13(3))
  - Confidential commercial or financial information (HRS \xA7 92F-13(4))

template_fragments:
  statute_invocation: >-
    Pursuant to the Uniform Information Practices Act
    (HRS Chapter 92F)
  response_reminder: >-
    Under HAR \xA7 2-71-13, the agency must respond to this request
    within ten business days after receipt.
  fee_cap_notice: >-
    If fulfilling this request will cost more than $__FEE_CAP__,
    please provide an estimate before proceeding. Under
    HRS \xA7 92F-21, the first $30.00 in search fees is waived,
    and all fees must reflect actual costs.
  electronic_delivery_clause: >-
    I request that records be provided in electronic format where
    available.
  appeal_deadline_warning: >-
    If this request is denied, I reserve the right to seek judicial
    enforcement under HRS \xA7 92F-15, and the court shall award
    reasonable attorney fees and costs when the agency fails to
    sustain its burden of justification. I may also file a
    complaint with the Office of Information Practices under
    HRS \xA7 92F-15.5.
